<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QuantumServe ERP - Offline POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f0e8; padding: 12px; }
        .header { background: linear-gradient(135deg, #3d1f0d, #2a1508); color: white; padding: 15px 20px; border-radius: 16px; margin-bottom: 12px; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
        .online { background: #2d5c40; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .offline { background: #c25a3a; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .btn { background: #b8924a; color: white; border: none; padding: 12px 20px; border-radius: 25px; cursor: pointer; font-weight: 600; width: 100%; font-size: 16px; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; max-height: 400px; overflow-y: auto; }
        .product-card { background: #f9f6f0; border-radius: 12px; padding: 10px; text-align: center; cursor: pointer; border: 2px solid transparent; transition: border-color 0.15s; }
        .product-card:active { transform: scale(0.97); border-color: #b8924a; }
        .product-name { font-weight: 600; font-size: 13px; }
        .product-price { color: #3d1f0d; font-weight: bold; margin-top: 4px; }
        .product-stock { font-size: 10px; color: #666; margin-top: 4px; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        .total-row { font-size: 20px; font-weight: bold; padding: 12px 0; border-top: 2px solid #b8924a; margin-top: 10px; }
        .qty-btn { background: #ddd; border: none; width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; }
        .offline-banner { background: #c25a3a; color: white; padding: 8px; text-align: center; border-radius: 8px; margin-bottom: 12px; font-size: 11px; display: none; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .search-box { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; font-size: 14px; }
        .sync-pending { background: #b8924a; padding: 4px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; display: none; }
        @media (max-width: 700px) { .grid-2 { grid-template-columns: 1fr !important; } }
    </style>
</head>
<body>

<div class="header">
    <div class="status-bar">
        <span>⚛️ QuantumServe ERP</span>
        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <span id="connectionStatus" class="online">🟢 Online</span>
            <span id="roleDisplay" onclick="toggleRole()" style="background:rgba(255,255,255,0.2); padding:4px 12px; border-radius:20px; cursor:pointer;">👑 Admin</span>
            <span id="pendingCount" class="sync-pending" onclick="manualSync()">0 pending</span>
        </div>
    </div>
    <h3>💰 Point of Sale</h3>
    <p style="font-size: 11px; opacity: 0.8;">Works offline • Sales sync automatically</p>
</div>

<div id="offlineAlert" class="offline-banner">📡 OFFLINE MODE • Sales saved locally</div>

<div class="grid-2">
    <div class="card">
        <h4>📦 Products</h4>
        <input type="text" id="searchInput" class="search-box" placeholder="Search products...">
        <div id="productGrid" class="product-grid">
            <div style="text-align: center; padding: 20px; grid-column: 1/-1;">🔄 Loading products...</div>
        </div>
    </div>

    <div class="card">
        <h4>🛒 Cart</h4>
        <div id="cartItems" style="max-height: 350px; overflow-y: auto;">
            <div style="text-align: center; color: #999; padding: 20px;">Cart is empty</div>
        </div>
        <div class="total-row">Total: UGX <span id="cartTotal">0</span></div>
        <button class="btn" onclick="checkout()">💵 Checkout</button>
        <div id="checkoutMessage" style="margin-top: 8px; font-size: 12px;"></div>
    </div>
</div>

<script>
    // ── CONFIGURATION ──────────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://yzjtxtzsvmsbxvbeggny.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6anR4dHpzdm1zYnh2YmVnZ255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzU4MzcsImV4cCI6MjA5MzU1MTgzN30.EMihpnPlUrUStohHbsKevtsD0hgfdUEQ_UnWMbpk0O8';

    // ── STATE ──────────────────────────────────────────────────────────────────
    let supabaseClient = null;   // renamed to avoid any global clash with the library
    let products = [];
    let cart = [];
    let currentRole = 'admin';
    let isOnline = navigator.onLine;
    let offlineSales = [];       // simple in-memory queue — no IndexedDB

    // ── BOOT: wait for DOM AND Supabase library ─────────────────────────────
    document.addEventListener('DOMContentLoaded', function () {
        // Safety check: make sure the library actually loaded
        if (typeof window.supabase === 'undefined' || typeof window.supabase.createClient !== 'function') {
            showProductError('❌ Supabase library failed to load. Check your internet connection and refresh.');
            return;
        }

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            showProductError('❌ Failed to create Supabase client: ' + e.message);
            return;
        }

        // Network listeners
        window.addEventListener('online',  handleOnline);
        window.addEventListener('offline', handleOffline);

        // Search listener
        document.getElementById('searchInput').addEventListener('input', renderProducts);

        // Set initial network state then load products
        updateConnectionUI();
        loadProducts();
    });

    // ── NETWORK ────────────────────────────────────────────────────────────────
    function updateConnectionUI() {
        isOnline = navigator.onLine;
        const statusSpan  = document.getElementById('connectionStatus');
        const alertDiv    = document.getElementById('offlineAlert');

        if (isOnline) {
            statusSpan.textContent = '🟢 Online';
            statusSpan.className   = 'online';
            alertDiv.style.display = 'none';
        } else {
            statusSpan.textContent = '🔴 Offline';
            statusSpan.className   = 'offline';
            alertDiv.style.display = 'block';
        }
    }

    function handleOffline() {
        updateConnectionUI();
    }

    async function handleOnline() {
        updateConnectionUI();
        await loadProducts();

        if (offlineSales.length > 0) {
            showMessage(`🔄 Syncing ${offlineSales.length} offline sale(s)…`, 'info');
            const toSync = [...offlineSales];
            offlineSales = [];
            updatePendingCount();

            for (const sale of toSync) {
                for (const item of sale.cart) {
                    try {
                        await supabaseClient.from('sales').insert([{
                            product_id:   item.id,
                            product_name: item.name,
                            qty:          item.qty,
                            total:        item.price * item.qty,
                            user_id:      null
                        }]);
                    } catch (err) {
                        console.error('Sync error for item', item.name, err);
                    }
                }
            }

            await loadProducts();
            showMessage('✅ All offline sales synced!', 'success');
        }
    }

    function updatePendingCount() {
        const span = document.getElementById('pendingCount');
        if (offlineSales.length > 0) {
            span.style.display = 'inline-block';
            span.textContent   = `${offlineSales.length} pending`;
        } else {
            span.style.display = 'none';
        }
    }

    window.manualSync = function () {
        if (isOnline && offlineSales.length > 0) handleOnline();
    };

    // ── PRODUCTS ───────────────────────────────────────────────────────────────
    async function loadProducts() {
        showProductLoading();
        try {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('name');

            if (error) throw error;

            if (!data || data.length === 0) {
                showProductError('📦 No products found. Add products in Supabase.');
                return;
            }

            products = data;
            renderProducts();
        } catch (err) {
            console.error('loadProducts error:', err);
            showProductError('❌ Could not load products: ' + err.message);
        }
    }

    function showProductLoading() {
        document.getElementById('productGrid').innerHTML =
            '<div style="text-align:center;padding:20px;grid-column:1/-1;">🔄 Loading products…</div>';
    }

    function showProductError(msg) {
        document.getElementById('productGrid').innerHTML =
            `<div style="text-align:center;padding:20px;grid-column:1/-1;color:#c25a3a;">${msg}</div>`;
    }

    function renderProducts() {
        const term     = (document.getElementById('searchInput')?.value || '').toLowerCase();
        const filtered = products.filter(p => p.name.toLowerCase().includes(term));
        const grid     = document.getElementById('productGrid');

        if (filtered.length === 0) {
            grid.innerHTML = '<div style="text-align:center;padding:20px;grid-column:1/-1;">No products found</div>';
            return;
        }

        grid.innerHTML = filtered.map(p => `
            <div class="product-card"
                 onclick="addToCart('${p.id}','${escHtml(p.name)}',${p.price},${p.stock ?? 0})">
                <div class="product-name">${escHtml(p.name)}</div>
                <div class="product-price">UGX ${Number(p.price).toLocaleString()}</div>
                <div class="product-stock">Stock: ${p.stock ?? 0}</div>
                ${currentRole === 'admin'
                    ? `<div class="product-stock" style="color:#b8924a;">Cost: UGX ${Number(p.cost_price || 0).toLocaleString()}</div>`
                    : ''}
            </div>
        `).join('');
    }

    // ── CART ───────────────────────────────────────────────────────────────────
    window.addToCart = function (id, name, price, stock) {
        const existing = cart.find(i => i.id === id);
        if (existing) {
            if (existing.qty + 1 > stock) { showMessage('Not enough stock!', 'error'); return; }
            existing.qty++;
        } else {
            cart.push({ id, name, price, qty: 1, stock });
        }
        renderCart();
    };

    window.updateQty = function (idx, delta) {
        const item   = cart[idx];
        const newQty = item.qty + delta;
        if (newQty < 1) {
            cart.splice(idx, 1);
        } else if (newQty <= item.stock) {
            item.qty = newQty;
        } else {
            showMessage('Not enough stock!', 'error');
        }
        renderCart();
    };

    function renderCart() {
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align:center;color:#999;padding:20px;">Cart is empty</div>';
            document.getElementById('cartTotal').textContent = '0';
            return;
        }

        let total = 0;
        container.innerHTML = cart.map((item, idx) => {
            const sub = item.price * item.qty;
            total += sub;
            return `
                <div class="cart-item">
                    <div style="flex:2;font-size:13px;">${escHtml(item.name)}</div>
                    <div style="display:flex;gap:6px;align-items:center;">
                        <button class="qty-btn" onclick="updateQty(${idx},-1)">−</button>
                        <span style="min-width:24px;text-align:center;">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                    </div>
                    <div style="min-width:80px;text-align:right;font-size:13px;">
                        UGX ${sub.toLocaleString()}
                    </div>
                </div>`;
        }).join('');

        document.getElementById('cartTotal').textContent = total.toLocaleString();
    }

    // ── CHECKOUT ───────────────────────────────────────────────────────────────
    window.checkout = async function () {
        if (cart.length === 0) { showMessage('Cart is empty', 'error'); return; }

        const total = cart.reduce((s, i) => s + i.price * i.qty, 0);

        // ── OFFLINE path ──
        if (!isOnline) {
            offlineSales.push({ cart: [...cart], total, timestamp: new Date().toISOString() });
            updatePendingCount();
            showMessage(`💾 Saved offline: UGX ${total.toLocaleString()} — will sync when online`, 'success');
            cart = [];
            renderCart();
            return;
        }

        // ── ONLINE path ──
        showMessage('⏳ Processing…', 'info');
        try {
            const inserts = cart.map(item => ({
                product_id:   item.id,
                product_name: item.name,
                qty:          item.qty,
                total:        item.price * item.qty,
                user_id:      null
            }));

            // Insert all items; throw on first error
            for (const row of inserts) {
                const { error } = await supabaseClient.from('sales').insert([row]);
                if (error) throw error;
            }

            showMessage(`✅ Sale complete! UGX ${total.toLocaleString()}`, 'success');
            cart = [];
            renderCart();
            await loadProducts(); // refresh stock
        } catch (err) {
            console.error('Checkout error:', err);
            showMessage('❌ ' + err.message, 'error');
        }
    };

    // ── UI HELPERS ─────────────────────────────────────────────────────────────
    window.toggleRole = function () {
        currentRole = currentRole === 'admin' ? 'cashier' : 'admin';
        document.getElementById('roleDisplay').innerHTML =
            currentRole === 'admin' ? '👑 Admin' : '🔒 Cashier';
        renderProducts();
    };

    function showMessage(msg, type) {
        const div = document.getElementById('checkoutMessage');
        const bg  = type === 'error' ? '#c25a3a' : type === 'info' ? '#b8924a' : '#2d5c40';
        div.innerHTML = `<div style="background:${bg};color:white;padding:8px;border-radius:8px;">${msg}</div>`;
        if (type !== 'info') setTimeout(() => { div.innerHTML = ''; }, 4000);
    }

    function escHtml(str) {
        if (!str) return '';
        return String(str)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }
</script>
</body>
</html>
