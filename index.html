<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumServe ERP - DIAGNOSTIC</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: monospace; padding: 20px; background: #f5f0e8; }
        .log { background: #1e1e1e; color: #d4d4d4; padding: 10px; border-radius: 8px; margin: 10px 0; font-size: 12px; overflow-x: auto; }
        .error { color: #f48771; }
        .success { color: #6a9955; }
        .info { color: #9cdcfe; }
        pre { margin: 0; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>🔍 QuantumServe ERP - Diagnostic Mode</h1>
    <p>Open <strong>Browser Console (F12)</strong> to see detailed logs</p>
    <div id="logs" class="log"></div>

    <script>
        const SUPABASE_URL = 'https://yzjtxtzsvmsbxvbeggny.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6anR4dHpzdm1zYnh2YmVnZ255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzU4MzcsImV4cCI6MjA5MzU1MTgzN30.EMihpnPlUrUStohHbsKevtsD0hgfdUEQ_UnWMbpk0O8';
        
        const logsDiv = document.getElementById('logs');
        
        function addLog(message, type = 'info') {
            const line = document.createElement('div');
            line.className = type;
            line.innerHTML = `[${new Date().toLocaleTimeString()}] ${message}`;
            logsDiv.appendChild(line);
            console.log(message);
        }
        
        async function runDiagnostics() {
            addLog('🔍 Starting diagnostics...', 'info');
            addLog(`Supabase URL: ${SUPABASE_URL}`, 'info');
            addLog(`Anon Key (first 20 chars): ${SUPABASE_ANON_KEY.substring(0,20)}...`, 'info');
            
            // Step 1: Check if Supabase is loaded
            addLog('Step 1: Checking if Supabase library loaded...', 'info');
            if (typeof window.supabase === 'undefined') {
                addLog('❌ CRITICAL: Supabase library NOT loaded!', 'error');
                return;
            }
            addLog('✅ Supabase library loaded', 'success');
            
            // Step 2: Create client
            addLog('Step 2: Creating Supabase client...', 'info');
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                addLog('✅ Supabase client created', 'success');
                
                // Step 3: Test connection - try to get products
                addLog('Step 3: Attempting to fetch products...', 'info');
                const { data, error, status } = await supabase.from('products').select('*');
                
                if (error) {
                    addLog(`❌ Supabase error occurred!`, 'error');
                    addLog(`Error message: ${error.message}`, 'error');
                    addLog(`Error details: ${JSON.stringify(error, null, 2)}`, 'error');
                    return;
                }
                
                addLog(`✅ Success! Retrieved ${data ? data.length : 0} products`, 'success');
                addLog(`HTTP Status: ${status || 'OK'}`, 'info');
                
                if (data && data.length > 0) {
                    addLog(`Sample product: ${JSON.stringify(data[0])}`, 'success');
                } else {
                    addLog(`⚠️ No products found in database!`, 'error');
                    addLog(`Solution: Insert products into your Supabase products table`, 'info');
                }
                
                // Step 4: Check if products table exists
                addLog('Step 4: Verifying table structure...', 'info');
                const { data: tableCheck, error: tableError } = await supabase
                    .from('products')
                    .select('count', { count: 'exact', head: true });
                
                if (tableError) {
                    addLog(`❌ Products table may not exist: ${tableError.message}`, 'error');
                } else {
                    addLog(`✅ Products table exists`, 'success');
                }
                
            } catch (err) {
                addLog(`❌ EXCEPTION: ${err.message}`, 'error');
                addLog(`Stack: ${err.stack}`, 'error');
            }
            
            addLog('🏁 Diagnostics complete!', 'info');
        }
        
        // Wait for DOM and Supabase
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(runDiagnostics, 1000);
        });
    </script>
</body>
</html>
