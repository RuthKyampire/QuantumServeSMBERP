<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>QuantumServe ERP - Offline POS</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta name="theme-color" content="#3d1f0d">
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #f5f0e8; 
            padding: 12px;
        }
        .header { 
            background: linear-gradient(135deg, #3d1f0d, #2a1508); 
            color: white; 
            padding: 15px 20px; 
            border-radius: 16px; 
            margin-bottom: 12px;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .online { background: #2d5c40; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .offline { background: #c25a3a; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .syncing { background: #b8924a; padding: 4px 12px; border-radius: 20px; font-size: 11px; }
        .btn { 
            background: #b8924a; 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 25px; 
            cursor: pointer; 
            font-weight: 600;
            width: 100%;
        }
        .btn-primary { background: #3d1f0d; }
        .card { 
            background: white; 
            border-radius: 16px; 
            padding: 16px; 
            margin-bottom: 12px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 12px;
            max-height: 400px;
            overflow-y: auto;
        }
        .product-card {
            background: #f9f6f0;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .product-card:active { transform: scale(0.97); }
        .product-card.selected { border-color: #b8924a; background: #fff8f0; }
        .product-card.disabled { opacity: 0.5; cursor: not-allowed; }
        .product-name { font-weight: 600; font-size: 13px; }
        .product-price { color: #3d1f0d; font-weight: bold; margin-top: 4px; font-size: 14px; }
        .product-stock { font-size: 10px; color: #666; margin-top: 4px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .total-row {
            font-size: 20px;
            font-weight: bold;
            padding: 12px 0;
            border-top: 2px solid #b8924a;
            margin-top: 10px;
        }
        .qty-control {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .qty-btn {
            background: #ddd;
            border: none;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
        }
        .offline-banner {
            background: #c25a3a;
            color: white;
            padding: 8px;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 11px;
        }
        .sync-pending-badge {
            background: #b8924a;
            color: white;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            cursor: pointer;
        }
        .role-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
        }
        @media (max-width: 700px) {
            .grid-2 { grid-template-columns: 1fr !important; }
            .product-grid { max-height: 300px; }
        }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .search-box { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; }
        .pending-sales { margin-top: 10px; font-size: 12px; color: #b8924a; }
    </style>
</head>
<body>

<div class="header">
    <div class="status-bar">
        <span>⚛️ QuantumServe ERP</span>
        <div style="display: flex; gap: 8px;">
            <span id="connectionStatus" class="online">🟢 Online</span>
            <span id="roleDisplay" class="role-badge" onclick="toggleRole()">👑 Admin</span>
        </div>
    </div>
    <div class="status-bar">
        <span id="syncStatus"></span>
        <span id="pendingCount" class="sync-pending-badge" style="display:none;" onclick="manualSync()">0 pending</span>
    </div>
    <h3 style="margin-top: 8px;">💰 Point of Sale</h3>
    <p style="font-size: 11px; opacity: 0.8;">Works offline • Sales sync automatically</p>
</div>

<div id="offlineAlert" style="display: none;" class="offline-banner">
    📡 OFFLINE MODE • Sales will be saved locally and sync when online
</div>

<div class="grid-2">
    <div class="card">
        <h4>📦 Products</h4>
        <input type="text" id="searchInput" class="search-box" placeholder="Search products...">
        <div id="productGrid" class="product-grid">
            <div style="text-align: center; padding: 20px;">Loading products...</div>
        </div>
    </div>

    <div class="card">
        <h4>🛒 Cart <span id="cartItemCount" style="font-size: 12px; color: #666;"></span></h4>
        <div id="cartItems" style="max-height: 350px; overflow-y: auto;">
            <div style="text-align: center; color: #999; padding: 20px;">Cart is empty</div>
        </div>
        <div class="total-row">
            Total: UGX <span id="cartTotal">0</span>
        </div>
        <button class="btn" onclick="checkout()" id="checkoutBtn">💵 Checkout</button>
        <div id="checkoutMessage" style="margin-top: 8px; font-size: 12px;"></div>
        <div id="pendingSalesInfo" class="pending-sales"></div>
    </div>
</div>

<script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const SUPABASE_URL = 'https://yzjtxtzsvmsbxvbeggny.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6anR4dHpzdm1zYnh2YmVnZ255Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5NzU4MzcsImV4cCI6MjA5MzU1MTgzN30.EMihpnPlUrUStohHbsKevtsD0hgfdUEQ_UnWMbpk0O8';
    
    let supabase;
    let products = [];
    let cart = [];
    let currentRole = 'admin';
    let online = navigator.onLine;
    let pendingSales = []; // Offline sales queue
    
    // Database name for IndexedDB
    const DB_NAME = 'QuantumServeOfflineDB';
    const DB_VERSION = 1;
    let db;

    // ============================================
    // INDEXEDDB SETUP (Offline Storage)
    // ============================================
    function initIndexedDB() {
        return new Promise((resolve, reject) => {
            const request = indexedDB.open(DB_NAME, DB_VERSION);
            
            request.onerror = () => reject(request.error);
            request.onsuccess = () => {
                db = request.result;
                resolve();
            };
            
            request.onupgradeneeded = (event) => {
                const db = event.target.result;
                // Store for offline sales
                if (!db.objectStoreNames.contains('offline_sales')) {
                    const store = db.createObjectStore('offline_sales', { keyPath: 'id', autoIncrement: true });
                    store.createIndex('synced', 'synced');
                }
                // Store for products cache
                if (!db.objectStoreNames.contains('products_cache')) {
                    db.createObjectStore('products_cache', { keyPath: 'id' });
                }
            };
        });
    }

    // Save sale to IndexedDB (when offline)
    async function saveSaleOffline(sale) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(['offline_sales'], 'readwrite');
            const store = transaction.objectStore('offline_sales');
            const request = store.add({
                ...sale,
                synced: false,
                created_at: new Date().toISOString()
            });
            request.onsuccess = () => resolve();
            request.onerror = () => reject(request.error);
        });
    }

    // Get all unsynced sales
    async function getUnsyncedSales() {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(['offline_sales'], 'readonly');
            const store = transaction.objectStore('offline_sales');
            const index = store.index('synced');
            const request = index.getAll(IDBKeyRange.only(false));
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    // Mark sale as synced
    async function markSaleSynced(id) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(['offline_sales'], 'readwrite');
            const store = transaction.objectStore('offline_sales');
            const request = store.get(id);
            request.onsuccess = () => {
                const sale = request.result;
                if (sale) {
                    sale.synced = true;
                    store.put(sale);
                }
                resolve();
            };
            request.onerror = () => reject(request.error);
        });
    }

    // Cache products offline
    async function cacheProducts(productsData) {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(['products_cache'], 'readwrite');
            const store = transaction.objectStore('products_cache');
            productsData.forEach(product => {
                store.put(product);
            });
            transaction.oncomplete = () => resolve();
            transaction.onerror = () => reject(transaction.error);
        });
    }

    // Load products from cache (offline mode)
    async function loadProductsFromCache() {
        return new Promise((resolve, reject) => {
            const transaction = db.transaction(['products_cache'], 'readonly');
            const store = transaction.objectStore('products_cache');
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    }

    // ============================================
    // SYNC FUNCTION (Upload offline sales to cloud)
    // ============================================
    async function syncOfflineSales() {
        if (!online) return;
        
        const unsynced = await getUnsyncedSales();
        if (unsynced.length === 0) {
            document.getElementById('pendingCount').style.display = 'none';
            return;
        }
        
        document.getElementById('syncStatus').innerHTML = '🔄 Syncing...';
        document.getElementById('pendingCount').style.display = 'inline-block';
        document.getElementById('pendingCount').textContent = `${unsynced.length} pending`;
        
        let syncedCount = 0;
        for (const sale of unsynced) {
            try {
                const { error } = await supabase.from('sales').insert([{
                    product_id: sale.product_id,
                    product_name: sale.product_name,
                    qty: sale.qty,
                    total: sale.total,
                    user_id: '027d2a71-b287-4891-ad4f-9b17e64b07e2',
                    sale_date: sale.created_at
                }]);
                
                if (!error) {
                    await markSaleSynced(sale.id);
                    syncedCount++;
                    
                    // Also reduce stock after sync
                    await supabase.rpc('reduce_stock', { product_id: sale.product_id, quantity: sale.qty });
                }
            } catch (e) {
                console.error('Sync failed for sale:', sale, e);
            }
        }
        
        if (syncedCount > 0) {
            document.getElementById('syncStatus').innerHTML = `✅ Synced ${syncedCount} sales`;
            setTimeout(() => {
                document.getElementById('syncStatus').innerHTML = '';
            }, 3000);
            await loadProducts(); // Reload products after sync
        }
        
        const remaining = await getUnsyncedSales();
        if (remaining.length === 0) {
            document.getElementById('pendingCount').style.display = 'none';
        } else {
            document.getElementById('pendingCount').textContent = `${remaining.length} pending`;
        }
    }

    // ============================================
    // LOAD PRODUCTS (Online first, fallback to cache)
    // ============================================
    async function loadProducts() {
        if (online) {
            try {
                const { data, error } = await supabase.from('products').select('*').order('name');
                if (!error && data) {
                    products = data;
                    await cacheProducts(products);
                    renderProducts();
                    return;
                }
            } catch (e) {
                console.log('Online fetch failed, using cache');
            }
        }
        
        // Offline - load from cache
        const cached = await loadProductsFromCache();
        if (cached && cached.length) {
            products = cached;
            renderProducts();
        } else {
            document.getElementById('productGrid').innerHTML = '<div style="text-align:center; padding:20px;">⚠️ No products available offline. Connect to internet first.</div>';
        }
    }

    // ============================================
    // RENDER PRODUCTS (Role-based)
    // ============================================
    function renderProducts() {
        const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
        const filtered = products.filter(p => 
            p.name.toLowerCase().includes(searchTerm) && (p.stock > 0 || currentRole === 'admin')
        );
        
        const grid = document.getElementById('productGrid');
        grid.innerHTML = filtered.map(p => `
            <div class="product-card ${p.stock <= 0 ? 'disabled' : ''}" onclick="${p.stock > 0 ? `addToCart('${p.id}', '${escapeHtml(p.name)}', ${p.price}, ${p.stock})` : ''}">
                <div class="product-name">${escapeHtml(p.name)}</div>
                <div class="product-price">UGX ${p.price.toLocaleString()}</div>
                <div class="product-stock">Stock: ${p.stock}</div>
                ${currentRole === 'admin' ? `<div class="product-stock" style="color:#b8924a;">Cost: UGX ${p.cost_price}</div>` : ''}
            </div>
        `).join('');
    }

    // ============================================
    // CART FUNCTIONS
    // ============================================
    window.addToCart = function(id, name, price, stock) {
        const existing = cart.find(item => item.id === id);
        if (existing) {
            if (existing.qty + 1 > stock) {
                showMessage('Not enough stock!', 'error');
                return;
            }
            existing.qty++;
        } else {
            cart.push({ id, name, price, qty: 1, stock });
        }
        renderCart();
    };

    function renderCart() {
        const container = document.getElementById('cartItems');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">Cart is empty</div>';
            document.getElementById('cartTotal').textContent = '0';
            document.getElementById('cartItemCount').textContent = '';
            return;
        }
        
        let total = 0;
        container.innerHTML = cart.map((item, idx) => {
            const itemTotal = item.price * item.qty;
            total += itemTotal;
            return `
                <div class="cart-item">
                    <div style="flex:2">${escapeHtml(item.name)}</div>
                    <div class="qty-control">
                        <button class="qty-btn" onclick="updateQty(${idx}, -1)">-</button>
                        <span style="min-width: 30px; text-align: center;">${item.qty}</span>
                        <button class="qty-btn" onclick="updateQty(${idx}, 1)">+</button>
                    </div>
                    <div style="min-width: 80px; text-align: right;">UGX ${itemTotal.toLocaleString()}</div>
                </div>
            `;
        }).join('');
        
        document.getElementById('cartTotal').textContent = total.toLocaleString();
        document.getElementById('cartItemCount').textContent = `(${cart.reduce((s, i) => s + i.qty, 0)} items)`;
    }

    window.updateQty = function(idx, delta) {
        const item = cart[idx];
        const newQty = item.qty + delta;
        if (newQty < 1) {
            cart.splice(idx, 1);
        } else if (newQty <= item.stock) {
            item.qty = newQty;
        } else {
            showMessage('Not enough stock!', 'error');
        }
        renderCart();
    };

    // ============================================
    // CHECKOUT (Works offline!)
    // ============================================
    window.checkout = async function() {
        if (cart.length === 0) {
            showMessage('Cart is empty', 'error');
            return;
        }
        
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        
        if (online) {
            // Online: Save directly to Supabase
            try {
                for (const item of cart) {
                    const { error } = await supabase.from('sales').insert([{
                        product_id: item.id,
                        product_name: item.name,
                        qty: item.qty,
                        total: item.price * item.qty,
                        user_id: '027d2a71-b287-4891-ad4f-9b17e64b07e2'
                    }]);
                    if (error) throw error;
                }
                showMessage(`✅ Sale complete! UGX ${total.toLocaleString()}`, 'success');
                await loadProducts(); // Refresh stock
                cart = [];
                renderCart();
            } catch (error) {
                showMessage('Online save failed, saving offline...', 'error');
                await saveOfflineAndClearCart();
            }
        } else {
            // Offline: Save to IndexedDB
            await saveOfflineAndClearCart();
        }
    };
    
    async function saveOfflineAndClearCart() {
        for (const item of cart) {
            await saveSaleOffline({
                product_id: item.id,
                product_name: item.name,
                qty: item.qty,
                total: item.price * item.qty
            });
        }
        
        const total = cart.reduce((s, i) => s + (i.price * i.qty), 0);
        showMessage(`💾 Saved offline! UGX ${total.toLocaleString()} will sync when online.`, 'success');
        
        // Reduce stock locally for offline
        cart.forEach(item => {
            const product = products.find(p => p.id === item.id);
            if (product) product.stock -= item.qty;
        });
        
        cart = [];
        renderCart();
        renderProducts();
        updatePendingCount();
    }
    
    async function updatePendingCount() {
        const unsynced = await getUnsyncedSales();
        const count = unsynced.length;
        if (count > 0) {
            document.getElementById('pendingCount').style.display = 'inline-block';
            document.getElementById('pendingCount').textContent = `${count} pending`;
            document.getElementById('pendingSalesInfo').innerHTML = `📋 ${count} offline sale${count > 1 ? 's' : ''} waiting to sync`;
        } else {
            document.getElementById('pendingCount').style.display = 'none';
            document.getElementById('pendingSalesInfo').innerHTML = '';
        }
    }
    
    function showMessage(msg, type) {
        const div = document.getElementById('checkoutMessage');
        div.innerHTML = `<div style="background: ${type === 'error' ? '#c25a3a' : '#2d5c40'}; color: white; padding: 8px; border-radius: 8px;">${msg}</div>`;
        setTimeout(() => div.innerHTML = '', 3000);
    }
    
    // ============================================
    // ROLE TOGGLE
    // ============================================
    window.toggleRole = function() {
        currentRole = currentRole === 'admin' ? 'cashier' : 'admin';
        const display = document.getElementById('roleDisplay');
        display.innerHTML = currentRole === 'admin' ? '👑 Admin' : '🔒 Cashier';
        renderProducts();
    };
    
    window.manualSync = function() {
        if (online) syncOfflineSales();
    };
    
    // ============================================
    // NETWORK STATUS MONITORING
    // ============================================
    function updateNetworkStatus() {
        online = navigator.onLine;
        const statusSpan = document.getElementById('connectionStatus');
        const alertDiv = document.getElementById('offlineAlert');
        
        if (online) {
            statusSpan.innerHTML = '🟢 Online';
            statusSpan.className = 'online';
            alertDiv.style.display = 'none';
            syncOfflineSales();
        } else {
            statusSpan.innerHTML = '🔴 Offline';
            statusSpan.className = 'offline';
            alertDiv.style.display = 'block';
        }
    }
    
    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // ============================================
    // INITIALIZATION
    // ============================================
    async function init() {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await initIndexedDB();
        await loadProducts();
        updateNetworkStatus();
        setInterval(() => { if (online) syncOfflineSales(); }, 30000); // Sync every 30 sec
        
        document.getElementById('searchInput').addEventListener('input', renderProducts);
    }
    
    init();
</script>
</body>
</html>
