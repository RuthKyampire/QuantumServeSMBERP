<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — QuantumServe ERP</title>
  <link rel="icon" href="icons/favicon.ico">
  <style>
    :root {
      --bg: #0d0d0f;
      --bg2: #141416;
      --bg3: #1a1a1e;
      --gold: #d4a843;
      --text: #f0eee8;
      --text3: rgba(240,238,232,0.3);
      --border: rgba(255,255,255,0.07);
      --amber: #fbbf24;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      overflow: hidden;
    }
    .logo img { width:100%; height:100%; object-fit:cover; }
    .icon { font-size: 52px; margin-bottom: 16px; }
    h1 {
      font-size: 22px; font-weight: 600;
      margin-bottom: 10px;
      color: var(--text);
    }
    p {
      font-size: 14px; line-height: 1.6;
      color: var(--text3);
      margin-bottom: 24px;
    }
    .tip {
      background: var(--bg3);
      border: 1px solid rgba(251,191,36,0.2);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 12px;
      color: var(--amber);
      margin-bottom: 24px;
      text-align: left;
    }
    button {
      background: linear-gradient(135deg, var(--gold), #a07020);
      color: #0d0d0f;
      border: none;
      padding: 13px 28px;
      border-radius: 12px;
      font-size: 14px; font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <img src="icons/icon-96x96.png" alt="QuantumServe" onerror="this.parentElement.innerHTML='⚛️'">
    </div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>QuantumServe is still working!<br>Your POS and cart work offline — sales are saved locally and sync automatically when you reconnect.</p>
    <div class="tip">
      💡 <strong>Tip:</strong> Open the app once while online to cache it. After that it works fully offline including checkout and stock tracking.
    </div>
    <button onclick="window.location.href='/'">Open QuantumServe ERP</button>
  </div>
</body>
</html>
