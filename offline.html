<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - QuantumServe</title>
    <style>
        body {
            font-family: system-ui;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f5f0e8;
            text-align: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { color: #3d1f0d; }
        .offline-icon { font-size: 64px; margin-bottom: 20px; }
        button {
            background: #b8924a;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            margin-top: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="offline-icon">📡</div>
        <h1>You're Offline</h1>
        <p>QuantumServe is still working!<br>Your sales are being saved locally.</p>
        <button onclick="window.location.reload()">Try Again</button>
    </div>
</body>
</html>
